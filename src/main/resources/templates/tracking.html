<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ReachOut — Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="fragments/layout :: navbar(activePage='tracking')"></div>

  <div class="ro-page">
    <div class="ro-page-header">
      <h1>Delivery Tracking</h1>
      <p>Advance a matched request through its delivery stages: Assigned &rarr; In Transit &rarr; Delivered.</p>
    </div>

    <div class="ro-alert ro-alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="ro-alert ro-alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="ro-card">
      <h2>Advance Status</h2>
      <form class="ro-form-row" method="post" th:action="@{/tracking/advance}">
        <div class="ro-field">
          <label>Request ID</label>
          <input type="number" name="requestId" required>
        </div>
        <button type="submit" class="ro-btn">Advance Status &rarr;</button>
      </form>
    </div>

    <div class="ro-card">
      <h2>
        Requests
        <span style="font-weight:400;color:var(--ro-gray-500);font-size:13px;">
          (Total: <span th:text="${total}">0</span> &middot; Delivered: <span th:text="${delivered}">0</span>)
        </span>
      </h2>
      <div class="ro-table-wrap">
        <table class="ro-table">
          <thead><tr><th>ID</th><th>Requester</th><th>Item</th><th>Status</th><th>Resource</th><th>Volunteer</th></tr></thead>
          <tbody>
            <tr th:each="r : ${requests}">
              <td th:text="${r.requestId}"></td>
              <td th:text="${r.requesterName}"></td>
              <td th:text="${r.itemNeeded}"></td>
              <td>
                <span class="ro-badge"
                      th:classappend="'ro-badge-' + ${#strings.toLowerCase(#strings.replace(r.status,'_',''))}"
                      th:text="${r.status}"></span>
              </td>
              <td th:text="${r.matchedResourceId} ?: '-'"></td>
              <td th:text="${r.assignedVolunteerId} ?: '-'"></td>
            </tr>
          </tbody>
        </table>
        <p class="ro-empty-state" th:if="${requests == null or #lists.isEmpty(requests)}">No requests yet.</p>
      </div>
    </div>
  </div>
</body>
</html>
